# Site settings
title: "Xinyi (Cynthia) Fan"
email: xfan31@illinois.edu
description: >- # this means to ignore newlines until "baseurl:"
  Personal academic website of Xinyi (Cynthia) Fan, Computer Science Ph.D.
  student at the University of Illinois Urbana-Champaign.
url: "https://xinyifan11.github.io"
github_username: xinyifan11
minimal_mistakes_skin: default
search: false

# Build settings
