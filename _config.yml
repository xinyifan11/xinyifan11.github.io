# Plugins (previously gems:)
plugins:
  - jekyll-remote-theme
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-include-cache

author:
  name     : "Xinyi (Cynthia) Fan"
  avatar   : "/assets/images/profile.jpg"
  bio      : "Computer Science Ph.D. Student"
  location : "Urbana, Illinois"
  employer : "University of Illinois Urbana-Champaign"
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:xfan31@illinois.edu"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/YOUR-LINKEDIN-HANDLE/"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/xinyifan11"

footer:
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/YOUR-LINKEDIN-HANDLE/"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/xinyifan11"

